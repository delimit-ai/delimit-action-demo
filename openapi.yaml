openapi: "3.0.3"
info:
  title: Users API
  version: "2.0.0"
paths:
  /users:
    get:
      summary: List users
      parameters:
        - name: tenant_id
          in: header
          required: true
          schema:
            type: string
      responses:
        "200":
          description: User list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"
    post:
      summary: Create user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/User"
      responses:
        "201":
          description: Created
  /users/{userId}:
    get:
      summary: Get user
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: A user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
  /v2/users:
    get:
      summary: List users (v2)
      responses:
        "200":
          description: User list v2
components:
  schemas:
    User:
      type: object
      required: [id, email, tenant_id]
      properties:
        id:
          type: integer
        email:
          type: string
        display_name:
          type: string
        role:
          type: string
          enum: [admin, viewer]
