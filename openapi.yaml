openapi: "3.0.3"
info:
  title: Users API
  version: "2.0.0"
paths:
  /users:
    get:
      summary: List users
      deprecated: true
      parameters:
        - name: limit
          in: query
          required: true
          schema:
            type: string
            maximum: 50
        - name: status
          in: query
          schema:
            type: string
            enum: [active, inactive]
      responses:
        "200":
          description: User list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"
    post:
      summary: Create user
      security:
        - bearerAuth: [write:users]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUser"
      responses:
        "201":
          description: Created
  /users/{userId}:
    get:
      summary: Get user by ID
      security:
        - bearerAuth: [read:users]
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: A user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
  /v2/users:
    get:
      summary: List users (v2)
      security:
        - bearerAuth: [read:users]
      responses:
        "200":
          description: User list
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    User:
      type: object
      required: [id, email, name, tenant_id]
      properties:
        id:
          type: integer
        email:
          type: string
          format: email
        name:
          type: string
          minLength: 2
          maxLength: 50
        role:
          type: string
          enum: [admin, viewer]
          default: admin
        status:
          type: string
          enum: [active, inactive]
        tenant_id:
          type: string
        created_at:
          type: string
          format: date-time
    CreateUser:
      type: object
      required: [email, name, tenant_id]
      properties:
        email:
          type: string
          format: email
        name:
          type: string
          minLength: 2
          maxLength: 50
        role:
          type: string
          enum: [admin, viewer]
          default: admin
        tenant_id:
          type: string
