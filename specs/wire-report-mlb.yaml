openapi: 3.1.0
info:
  title: WireIntel MLB Signals API
  version: 2.0.0
  description: 'Fantasy-focused MLB intelligence for builders. Proprietary derived
    signals - not raw data.


    WireIntel computes proprietary model signals from publicly available MLB data.
    Every response is a derived calculation — win probabilities, momentum indices,
    stability scores, fantasy environment ratings — not a mirror of any official stats
    feed.


    **What you get:**

    - Model-derived win probabilities with confidence scores

    - Bullpen fatigue indices and park factor adjustments

    - Pitcher stability and durability signals

    - Fantasy environment scores (0-100) per game

    - Momentum and form labels for teams


    **What this is NOT:**

    - Not raw box scores or play-by-play

    - Not official MLB statistics

    - Not gambling advice


    All signals are generated by WireIntel proprietary models. Use them to build fantasy
    tools, dashboards, Discord bots, and analytics apps.'
  contact:
    name: WireIntel Support
    email: support@wire.report
    url: https://wire.report
  license:
    name: Proprietary
    url: https://wire.report/terms
servers:
- url: http://216.128.150.51:8080
  description: Production
security:
- RapidAPIKey: []
tags:
- name: MLB Signals
  description: Core MLB game, team, and pitcher signal endpoints
- name: Fantasy
  description: Fantasy-oriented environment and scoring signals
- name: System
  description: Health and status endpoints
paths:
  /v1/health:
    get:
      operationId: getHealth
      summary: Health check
      description: Returns API health status. No authentication required.
      tags:
      - System
      security: []
      responses:
        '200':
          description: API is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  version:
                    type: string
                    example: 2.0.0
                  timestamp:
                    type: string
                    format: date-time
                    example: '2026-04-15T18:30:00Z'
                required:
                - status
                - version
                - timestamp
  /v1/mlb/signals/slate/today:
    get:
      operationId: getSlateToday
      summary: Today's MLB game slate with model signals
      description: 'Returns every MLB game scheduled for today with WireIntel''s proprietary
        model signals attached. Includes win probabilities, confidence scores, volatility,
        fantasy environment scores, and directional signal labels.


        This is the primary endpoint for getting a full-day overview. Call it once
        and fan out to per-game or per-pitcher endpoints for deeper drill-downs.'
      tags:
      - MLB Signals
      responses:
        '200':
          description: Today's slate with signals
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SlateResponse'
              example:
                date: '2026-07-15'
                model_version: 2.0.0
                signal_generated_at: '2026-07-15T11:00:00Z'
                disclaimer: Signals are proprietary model outputs, not official statistics.
                  Not gambling advice.
                disclaimer_version: '1.0'
                count: 2
                games:
                - game_id: mlb_2026_07_15_nyy_bos
                  home_team: BOS
                  away_team: NYY
                  game_status: scheduled
                  model_win_probability_home: 0.54
                  model_win_probability_away: 0.46
                  confidence_score: 0.72
                  volatility_score: 0.38
                  fantasy_environment_score: 78
                  signal_label: LEAN_HOME
                  signal_strength: MODERATE
                - game_id: mlb_2026_07_15_lad_sfg
                  home_team: SFG
                  away_team: LAD
                  game_status: scheduled
                  model_win_probability_home: 0.41
                  model_win_probability_away: 0.59
                  confidence_score: 0.81
                  volatility_score: 0.22
                  fantasy_environment_score: 65
                  signal_label: LEAN_AWAY
                  signal_strength: STRONG
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
  /v1/mlb/signals/game/{game_id}:
    get:
      operationId: getGameSignal
      summary: Detailed signals for one game
      description: Returns the full signal breakdown for a single MLB game, including
        bullpen fatigue indices, park factor adjustments, and a list of contributing
        factors. Use the game_id from the slate endpoint.
      tags:
      - MLB Signals
      parameters:
      - name: game_id
        in: path
        required: true
        description: Unique game identifier from the slate endpoint
        schema:
          type: string
        example: mlb_2026_07_15_nyy_bos
      responses:
        '200':
          description: Detailed game signal
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameSignalResponse'
              example:
                game_id: mlb_2026_07_15_nyy_bos
                home_team: BOS
                away_team: NYY
                game_status: scheduled
                signal_generated_at: '2026-07-15T11:00:00Z'
                model_version: 2.0.0
                model_win_probability_home: 0.54
                model_win_probability_away: 0.46
                confidence_score: 0.72
                volatility_score: 0.38
                fantasy_environment_score: 78
                signal_label: LEAN_HOME
                signal_strength: MODERATE
                bullpen_fatigue_index_home: 0.35
                bullpen_fatigue_index_away: 0.61
                park_factor_adjustment: 1.08
                factors:
                - Home starter has 2.95 derived ERA trend over last 5 starts
                - Away bullpen fatigue index elevated (0.61) — heavy recent usage
                - Fenway park factor above neutral (1.08) favoring offense
                - Home team on 7-3 run in last 10 games
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
  /v1/mlb/signals/team/{team_id}:
    get:
      operationId: getTeamSignal
      summary: Team momentum and form signals
      description: Returns momentum, form, and trend signals for an MLB team. Includes
        season win rate, recent form, run differential, and bullpen fatigue. The form_label
        (HOT, COLD, NEUTRAL) summarizes the team's current trajectory.
      tags:
      - MLB Signals
      parameters:
      - name: team_id
        in: path
        required: true
        description: Team identifier (e.g., abbreviation or numeric ID)
        schema:
          type: string
        example: BOS
      responses:
        '200':
          description: Team momentum signal
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamSignalResponse'
              example:
                team_id: BOS
                team_name: Boston Red Sox
                abbreviation: BOS
                signal_generated_at: '2026-07-15T11:00:00Z'
                model_version: 2.0.0
                season_record: 52-40
                season_win_rate: 0.565
                recent_10_win_rate: 0.7
                momentum_index: 0.74
                run_differential_per_game: 0.83
                bullpen_fatigue_index: 0.35
                form_label: HOT
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
  /v1/mlb/signals/pitcher/{player_id}:
    get:
      operationId: getPitcherSignal
      summary: Pitcher stability signals
      description: 'Returns stability, durability, and trend signals for an MLB pitcher.
        Includes derived ERA trend, derived WHIP trend, K/9 rate, recent workload,
        and a stability label (ACE, RELIABLE, VOLATILE, RISKY).


        All stats are model-derived trends, not raw official statistics.'
      tags:
      - MLB Signals
      parameters:
      - name: player_id
        in: path
        required: true
        description: Player identifier
        schema:
          type: string
        example: p_cole_gerrit
      responses:
        '200':
          description: Pitcher stability signal
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PitcherSignalResponse'
              example:
                player_id: p_cole_gerrit
                name: Gerrit Cole
                team: NYY
                position: SP
                signal_generated_at: '2026-07-15T11:00:00Z'
                model_version: 2.0.0
                stability_score: 0.88
                durability_index: 0.79
                derived_era_trend: 2.95
                derived_whip_trend: 1.04
                derived_k_per_9: 11.2
                recent_workload_ip: 18.2
                pitcher_label: ACE
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
  /v1/mlb/fantasy/environment/{game_id}:
    get:
      operationId: getFantasyEnvironment
      summary: Fantasy environment score for a game
      description: 'Returns a composite fantasy environment score (0-100) for a specific
        MLB game. Factors in park effects, bullpen fatigue, weather proxies, and offensive
        context to indicate how fantasy-friendly the game environment is.


        PREMIUM environments (80+) suggest elevated scoring potential. POOR environments
        (below 40) suggest suppressed offensive output.'
      tags:
      - Fantasy
      parameters:
      - name: game_id
        in: path
        required: true
        description: Unique game identifier from the slate endpoint
        schema:
          type: string
        example: mlb_2026_07_15_nyy_bos
      responses:
        '200':
          description: Fantasy environment signal
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FantasyEnvironmentResponse'
              example:
                game_id: mlb_2026_07_15_nyy_bos
                signal_generated_at: '2026-07-15T11:00:00Z'
                model_version: 2.0.0
                home_team: BOS
                away_team: NYY
                venue: Fenway Park
                fantasy_environment_score: 78
                environment_label: GOOD
                park_factor_adjustment: 1.08
                bullpen_fatigue_index_home: 0.35
                bullpen_fatigue_index_away: 0.61
                environment_factors:
                - factor: park_factor
                  impact: positive
                  detail: Fenway Park runs above neutral (1.08) — historically hitter-friendly
                - factor: bullpen_fatigue_away
                  impact: positive
                  detail: Away bullpen fatigue elevated (0.61) — late-inning scoring
                    opportunity
                - factor: offensive_context
                  impact: positive
                  detail: Both lineups rank top-10 in model-derived wRC+ trend
                - factor: pitching_matchup
                  impact: negative
                  detail: Home starter stability score high (0.88) — may suppress
                    early offense
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
components:
  securitySchemes:
    RapidAPIKey:
      type: apiKey
      in: header
      name: X-RapidAPI-Key
      description: Your RapidAPI subscription key. Obtain from the RapidAPI marketplace
        after subscribing to WireIntel MLB Signals API.
  schemas:
    SlateResponse:
      type: object
      required:
      - date
      - model_version
      - signal_generated_at
      - disclaimer
      - disclaimer_version
      - count
      - games
      properties:
        date:
          type: string
          description: Date of the slate (YYYY-MM-DD)
          example: '2026-07-15'
        model_version:
          type: string
          description: Version of the signal model
          example: 2.0.0
        signal_generated_at:
          type: string
          format: date-time
          description: ISO 8601 timestamp when signals were computed
          example: '2026-07-15T11:00:00Z'
        disclaimer:
          type: string
          description: Legal disclaimer included in every response
          example: Signals are proprietary model outputs, not official statistics.
            Not gambling advice.
        disclaimer_version:
          type: string
          description: Version of the disclaimer text
          example: '1.0'
        count:
          type: integer
          description: Number of games in the slate
          example: 15
        games:
          type: array
          items:
            $ref: '#/components/schemas/SlateGame'
    SlateGame:
      type: object
      required:
      - game_id
      - home_team
      - away_team
      - game_status
      - model_win_probability_home
      - model_win_probability_away
      - confidence_score
      - volatility_score
      - fantasy_environment_score
      - signal_label
      - signal_strength
      properties:
        game_id:
          type: string
          description: Unique game identifier
          example: mlb_2026_07_15_nyy_bos
        home_team:
          type: string
          description: Home team abbreviation
          example: BOS
        away_team:
          type: string
          description: Away team abbreviation
          example: NYY
        game_status:
          type: string
          description: Current game status
          example: scheduled
        model_win_probability_home:
          type: number
          minimum: 0
          maximum: 1
          description: Model-derived home team win probability
          example: 0.54
        model_win_probability_away:
          type: number
          minimum: 0
          maximum: 1
          description: Model-derived away team win probability
          example: 0.46
        confidence_score:
          type: number
          minimum: 0
          maximum: 1
          description: Model confidence in the signal (higher = more data/less noise)
          example: 0.72
        volatility_score:
          type: number
          minimum: 0
          maximum: 1
          description: Expected game volatility (higher = more variance)
          example: 0.38
        fantasy_environment_score:
          type: integer
          minimum: 0
          maximum: 100
          description: Composite fantasy-friendliness score
          example: 78
        signal_label:
          type: string
          enum:
          - STRONG_HOME
          - LEAN_HOME
          - TOSS_UP
          - LEAN_AWAY
          - STRONG_AWAY
          description: Directional signal label
          example: LEAN_HOME
        signal_strength:
          type: string
          enum:
          - STRONG
          - MODERATE
          - WEAK
          description: Strength of the signal
          example: MODERATE
    GameSignalResponse:
      type: object
      required:
      - game_id
      - home_team
      - away_team
      - game_status
      - signal_generated_at
      - model_version
      - model_win_probability_home
      - model_win_probability_away
      - volatility_score
      - fantasy_environment_score
      - signal_label
      - signal_strength
      - bullpen_fatigue_index_home
      - bullpen_fatigue_index_away
      - park_factor_adjustment
      - factors
      properties:
        game_id:
          type: string
          description: Unique game identifier
          example: mlb_2026_07_15_nyy_bos
        home_team:
          type: string
          description: Home team abbreviation
          example: BOS
        away_team:
          type: string
          description: Away team abbreviation
          example: NYY
        game_status:
          type: string
          description: Current game status
          example: scheduled
        signal_generated_at:
          type: string
          format: date-time
          description: ISO 8601 timestamp when signals were computed
          example: '2026-07-15T11:00:00Z'
        model_version:
          type: string
          description: Version of the signal model
          example: 2.0.0
        model_win_probability_home:
          type: number
          minimum: 0
          maximum: 1
          description: Model-derived home team win probability
          example: 0.54
        model_win_probability_away:
          type: number
          minimum: 0
          maximum: 1
          description: Model-derived away team win probability
          example: 0.46
        volatility_score:
          type: number
          minimum: 0
          maximum: 1
          description: Expected game volatility
          example: 0.38
        fantasy_environment_score:
          type: integer
          minimum: 0
          maximum: 100
          description: Composite fantasy-friendliness score
          example: 78
        signal_label:
          type: string
          enum:
          - STRONG_HOME
          - LEAN_HOME
          - TOSS_UP
          - LEAN_AWAY
          - STRONG_AWAY
          description: Directional signal label
          example: LEAN_HOME
        signal_strength:
          type: string
          enum:
          - STRONG
          - MODERATE
          - WEAK
          description: Strength of the signal
          example: MODERATE
        bullpen_fatigue_index_home:
          type: number
          minimum: 0
          maximum: 1
          description: Home team bullpen fatigue index (higher = more fatigued)
          example: 0.35
        bullpen_fatigue_index_away:
          type: number
          minimum: 0
          maximum: 1
          description: Away team bullpen fatigue index (higher = more fatigued)
          example: 0.61
        park_factor_adjustment:
          type: number
          description: Park factor adjustment (1.0 = neutral, >1.0 = hitter-friendly,
            <1.0 = pitcher-friendly)
          example: 1.08
        factors:
          type: array
          items:
            type: string
          description: Human-readable list of contributing factors
          example:
          - Home starter has 2.95 derived ERA trend over last 5 starts
          - Away bullpen fatigue index elevated (0.61)
    TeamSignalResponse:
      type: object
      required:
      - team_id
      - team_name
      - abbreviation
      - signal_generated_at
      - model_version
      - season_record
      - season_win_rate
      - recent_10_win_rate
      - momentum_index
      - run_differential_per_game
      - bullpen_fatigue_index
      - form_label
      properties:
        team_id:
          type: string
          description: Team identifier
          example: BOS
        team_name:
          type: string
          description: Full team name
          example: Boston Red Sox
        abbreviation:
          type: string
          description: Team abbreviation
          example: BOS
        signal_generated_at:
          type: string
          format: date-time
          description: ISO 8601 timestamp when signals were computed
          example: '2026-07-15T11:00:00Z'
        model_version:
          type: string
          description: Version of the signal model
          example: 2.0.0
        season_record:
          type: string
          description: Current season win-loss record
          example: 52-40
        season_win_rate:
          type: number
          description: Season win percentage
          example: 0.565
        recent_10_win_rate:
          type: number
          description: Win rate over the last 10 games
          example: 0.7
        momentum_index:
          type: number
          description: Model-derived momentum index combining recent form, run differential
            trend, and schedule strength
          example: 0.74
        run_differential_per_game:
          type: number
          description: Average run differential per game
          example: 0.83
        bullpen_fatigue_index:
          type: number
          description: Team bullpen fatigue index (higher = more fatigued)
          example: 0.35
        form_label:
          type: string
          enum:
          - HOT
          - COLD
          - NEUTRAL
          description: Current team form label
          example: HOT
    PitcherSignalResponse:
      type: object
      required:
      - player_id
      - name
      - team
      - position
      - signal_generated_at
      - model_version
      - stability_score
      - durability_index
      - derived_era_trend
      - derived_whip_trend
      - derived_k_per_9
      - recent_workload_ip
      - pitcher_label
      properties:
        player_id:
          type: string
          description: Player identifier
          example: p_cole_gerrit
        name:
          type: string
          description: Player display name
          example: Gerrit Cole
        team:
          type: string
          description: Team abbreviation
          example: NYY
        position:
          type: string
          description: Position (SP, RP, CL)
          example: SP
        signal_generated_at:
          type: string
          format: date-time
          description: ISO 8601 timestamp when signals were computed
          example: '2026-07-15T11:00:00Z'
        model_version:
          type: string
          description: Version of the signal model
          example: 2.0.0
        stability_score:
          type: number
          description: Model-derived stability score (higher = more consistent recent
            performance)
          example: 0.88
        durability_index:
          type: number
          description: Durability index based on workload and rest patterns
          example: 0.79
        derived_era_trend:
          type: number
          description: Model-derived ERA trend over recent starts (not official ERA)
          example: 2.95
        derived_whip_trend:
          type: number
          description: Model-derived WHIP trend over recent starts
          example: 1.04
        derived_k_per_9:
          type: number
          description: Model-derived strikeouts per 9 innings trend
          example: 11.2
        recent_workload_ip:
          type: number
          description: Innings pitched in last 7 days
          example: 18.2
        pitcher_label:
          type: string
          enum:
          - ACE
          - RELIABLE
          - VOLATILE
          - RISKY
          description: Pitcher stability label
          example: ACE
    FantasyEnvironmentResponse:
      type: object
      required:
      - game_id
      - signal_generated_at
      - model_version
      - home_team
      - away_team
      - venue
      - fantasy_environment_score
      - environment_label
      - park_factor_adjustment
      - bullpen_fatigue_index_home
      - bullpen_fatigue_index_away
      - environment_factors
      properties:
        game_id:
          type: string
          description: Unique game identifier
          example: mlb_2026_07_15_nyy_bos
        signal_generated_at:
          type: string
          format: date-time
          description: ISO 8601 timestamp when signals were computed
          example: '2026-07-15T11:00:00Z'
        model_version:
          type: string
          description: Version of the signal model
          example: 2.0.0
        home_team:
          type: string
          description: Home team abbreviation
          example: BOS
        away_team:
          type: string
          description: Away team abbreviation
          example: NYY
        venue:
          type: string
          description: Game venue name
          example: Fenway Park
        fantasy_environment_score:
          type: integer
          minimum: 0
          maximum: 100
          description: Composite fantasy environment score (0 = worst, 100 = best)
          example: 78
        environment_label:
          type: string
          enum:
          - PREMIUM
          - GOOD
          - AVERAGE
          - POOR
          description: Environment quality label
          example: GOOD
        park_factor_adjustment:
          type: number
          description: Park factor adjustment (1.0 = neutral)
          example: 1.08
        bullpen_fatigue_index_home:
          type: number
          minimum: 0
          maximum: 1
          description: Home team bullpen fatigue index
          example: 0.35
        bullpen_fatigue_index_away:
          type: number
          minimum: 0
          maximum: 1
          description: Away team bullpen fatigue index
          example: 0.61
        environment_factors:
          type: array
          items:
            $ref: '#/components/schemas/EnvironmentFactor'
          description: Detailed breakdown of factors affecting the fantasy environment
    EnvironmentFactor:
      type: object
      required:
      - factor
      - impact
      - detail
      properties:
        factor:
          type: string
          description: Factor name
          example: park_factor
        impact:
          type: string
          description: Direction of impact on fantasy scoring
          example: positive
        detail:
          type: string
          description: Human-readable explanation
          example: Fenway Park runs above neutral (1.08) — historically hitter-friendly
    ErrorResponse:
      type: object
      required:
      - error
      - message
      properties:
        error:
          type: string
          description: Error code
          example: not_found
        message:
          type: string
          description: Human-readable error message
          example: Game not found for the given game_id
  responses:
    Unauthorized:
      description: Missing or invalid API key
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: unauthorized
            message: Missing or invalid X-RapidAPI-Key header. Subscribe at RapidAPI
              to get your key.
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: not_found
            message: Game not found for the given game_id
    RateLimited:
      description: Rate limit exceeded
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: rate_limited
            message: Rate limit exceeded. Upgrade your plan for higher limits.
