name: API Contract Check
on:
  pull_request:
    paths:
      - 'openapi.yaml'

permissions:
  contents: read
  pull-requests: write
  id-token: write   # enables Sigstore-signed attestation (delimit-action v1.11.0+)

jobs:
  delimit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: delimit-ai/delimit-action@v1
        with:
          spec: openapi.yaml
          mode: advisory
